[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stem-studio-backend"
version = "0.1.0"
description = "Local audio separation and MIDI transcription workbench API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "python-multipart>=0.0.18", "mido>=1.3,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["stemwork*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

